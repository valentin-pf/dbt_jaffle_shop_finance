version: 2
models:
  - name: customer_revenue
    description: Versioned public finance data product. v2 contains a breaking rename and additional dates.
    latest_version: 2
    config:
      access: public
      contract:
        enforced: true
    versions:
      - v: 1
        deprecation_date: 2026-12-31
        columns:
          - name: customer_id
            data_type: string
            data_tests: [not_null, unique]
          - name: total_revenue
            data_type: numeric
            data_tests: [not_null]
          - name: order_count
            data_type: int64
            data_tests: [not_null]
      - v: 2
        columns:
          - name: customer_id
            data_type: string
            data_tests: [not_null, unique]
          - name: lifetime_revenue
            data_type: numeric
            data_tests: [not_null]
          - name: order_count
            data_type: int64
            data_tests: [not_null]
          - name: first_order_date
            data_type: date
          - name: last_order_date
            data_type: date
